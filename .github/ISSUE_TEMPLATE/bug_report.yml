name: Bug report
description: Report a reproducible TraceCC defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: TraceCC version and toolchain release ID
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest source and request that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
